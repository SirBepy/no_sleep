<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Sleep Page</title>
    <meta name="description" content="A lightweight web page that keeps your computer awake, no installs needed.">
    <meta property="og:title" content="No Sleep">
    <meta property="og:description"
        content="A lightweight web page that keeps your computer awake, no installs needed.">
    <meta property="og:image" content="assets/images/favicon.png">
    <meta property="og:url" content="https://sirbepy.github.io/no_sleep/">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9d7dfc">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sirbepy/sirbepy-styleguide@main/styleguide.css">
    <link rel="stylesheet" href="src/styles/styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div class="container card">
        <div class="account" id="account">
            <button class="account-btn" id="account-btn" type="button" aria-label="Sign in with Google"
                title="Sign in with Google to save your time"><i class="ph ph-user-circle"></i></button>
            <div class="account-menu" id="account-menu" hidden>
                <b id="account-email"></b>
                <button type="button" id="signout-btn">Sign out</button>
            </div>
        </div>

        <div class="info-button tooltip-trigger" id="info-button">
            <i class="ph ph-info" style="font-size: 20px;"></i>
            <div class="tooltip tooltip-right">
                <p>Keep this tab open and visible to prevent your PC from sleeping.</p>
            </div>
        </div>

        <h1>No Sleep</h1>

        <div class="timer">
            <span class="time-slot">
                <span id="time" class="time-display" role="button" tabindex="0" title="Click to edit"></span>
                <input id="time-input" class="time-input" type="text" inputmode="numeric" autocomplete="off"
                    aria-label="Elapsed time, hours:minutes:seconds" hidden>
                <button id="time-cancel" class="time-cancel" type="button" aria-label="Cancel edit" hidden><i
                        class="ph ph-x"></i></button>
            </span>
            <div class="time-error" id="time-error" role="alert"></div>
            <div class="running-for">running for</div>
        </div>

        <button class="pause-toggle" id="pause-toggle">
            <i class="ph-fill ph-pause icon-pause" style="font-size: 14px;"></i>
            <i class="ph-fill ph-play icon-play" style="font-size: 14px;"></i>
            <span>Pause</span>
        </button>
        <div class="pause-hint" id="pause-hint">Timer paused, but <b>No Sleep</b> is still keeping your PC awake.</div>
        <div class="card-actions">
            <button class="btn btn-ghost btn-sm" id="history-btn" type="button"><i
                    class="ph ph-clock-counter-clockwise"></i> History</button>
        </div>
    </div>

    <dialog class="history-dialog card" id="history-dialog" aria-labelledby="history-title">
        <div class="history-head">
            <h2 id="history-title">History</h2>
            <div class="history-head-actions">
                <button class="btn btn-primary btn-sm" id="history-add" type="button"><i class="ph ph-plus"></i> Add
                    entry</button>
                <button class="btn btn-ghost btn-sm" id="history-close" type="button" aria-label="Close"><i
                        class="ph ph-x"></i></button>
            </div>
        </div>
        <div class="history-summary">Last 30 days<b id="history-total">-</b></div>
        <form class="entry-form" id="entry-form" hidden>
            <div class="form-grid">
                <div class="field full"><label for="entry-date">Date</label><input class="input" type="date"
                        id="entry-date" required></div>
                <div class="field"><label for="entry-start">Started</label><input class="input" type="time"
                        id="entry-start" required></div>
                <div class="field"><label for="entry-stop">Stopped</label><input class="input" type="time"
                        id="entry-stop" required></div>
                <div class="field full"><label for="entry-note">Note (optional)</label><input class="input"
                        type="text" id="entry-note" maxlength="200" placeholder="What did you work on?"></div>
            </div>
            <div class="form-foot">
                <span class="entry-preview" id="entry-preview" aria-live="polite"></span>
                <div class="form-buttons">
                    <button class="btn btn-ghost btn-sm" id="entry-cancel" type="button">Cancel</button>
                    <button class="btn btn-primary btn-sm" id="entry-save" type="submit">Save entry</button>
                </div>
            </div>
        </form>
        <div class="history-body" id="history-body"></div>
    </dialog>

    <div class="footer">
        Keep this tab open to prevent your system from sleeping.
    </div>

    <script type="module" src="src/scripts/build-info.js"></script>
    <script type="module" src="src/scripts/script.js"></script>
    <!-- Settings widget - comment out to disable -->
    <script src="https://cdn.jsdelivr.net/gh/sirbepy/sirbepy-styleguide@main/widget/settings.js"></script>
    <!-- Register custom background variant before loading background.js -->
    <script>
      window.BEPY_BG_VARIANTS = [{
        key: "pulse",
        label: "Pulse",
        build: function () {
          var el = document.createElement("div");
          el.id = "bepy-bg-pulse";
          var css = "\n            #bepy-bg-pulse {\n              position: relative;\n              width: 100%; height: 100%;\n              background: radial-gradient(circle at center, #8ec5fc, #e0c3fc);\n              background-size: 200% 200%;\n              animation: bepy-pulse 15s ease infinite;\n            }\n            @keyframes bepy-pulse {\n              0%   { background-size: 100% 100%; background-position: center; }\n              50%  { background-size: 200% 200%; background-position: center; }\n              100% { background-size: 100% 100%; background-position: center; }\n            }\n          ";
          return { el: el, css: css };
        }
      }];
      // The widget defaults to its star pattern; Pulse is this page's own look, so it is the
      // first-visit default. Only seeded when nothing is stored, so a later pick in settings sticks.
      try {
        if (!localStorage.getItem("tabs-labs-bg-variant")) localStorage.setItem("tabs-labs-bg-variant", "pulse");
      } catch (err) { /* storage blocked: the widget falls back to its default */ }
    </script>
    <!-- Animated background. To disable: set window.BEPY_BACKGROUND = false before this tag. To use a custom SVG: set window.BEPY_BG_PATTERN = 'your-pattern.svg' before this tag. -->
    <script src="https://cdn.jsdelivr.net/gh/sirbepy/sirbepy-styleguide@main/widget/background.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js");
        }
    </script>
</body>

</html>
